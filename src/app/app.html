<mat-sidenav-container class="h-screen">
  <mat-sidenav #sidenav mode="over" class="sidenav" [autoFocus]="false">
    <a routerLink="/cats-search" (click)="sidenav.close()" aria-label="Go to cats search">
      <img src="assets/logo-orange-guys.svg" alt="Company Logo" class="p-4" />
    </a>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/cats-search"
        routerLinkActive="active-link"
        (click)="sidenav.close()"
        >Cats Search</a
      >
      <a
        mat-list-item
        routerLink="/breeds-library"
        routerLinkActive="active-link"
        (click)="sidenav.close()"
        >Breeds Library</a
      >
    </mat-nav-list>
    <img src="assets/coffee-cat.svg" alt="Coffee cat" class="w-[60px] coffee-cat" />
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <header class="header">
      <a routerLink="/cats-search" aria-label="Go to cats search">
        <img src="assets/logo-orange-guys.svg" alt="thortful logo" class="w-[60px]" />
      </a>
      <button mat-icon-button type="button" aria-label="Open navigation" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    </header>

    <main class="flex-1">
      <router-outlet></router-outlet>
    </main>

    <footer class="footer">
      <p>Made by Yehor with ❤️ for</p>
      <a href="https://www.thortful.com/" target="_blank">
        <img src="assets/logo-orange-guys.svg" alt="www.thortful.com" width="60px" />
      </a>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
